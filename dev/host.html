<!doctype html>
<!--
    A stand-in for the Framer editor, to try the plugin's UI in a browser:
    it answers the plugin's handshake, logs every framer.* call and resolves
    it with null. Open /dev/host.html on the dev server, or copy it into
    dist/ and open it there; ?readonly=1 denies addSVG, as for a viewer, and
    ?theme=dark hands the plugin Framer's dark theme, as the editor does.
-->
<html>
    <head>
        <meta charset="utf-8" />
        <title>Fake Framer host</title>
        <style>
            body {
                margin: 0;
                display: flex;
                font: 12px system-ui;
            }
            iframe {
                width: 360px;
                height: 560px;
                border: 1px solid #ccc;
            }
            pre {
                flex: 1;
                margin: 0;
                padding: 8px;
                height: 560px;
                overflow: auto;
                background: #f7f7f7;
            }
        </style>
    </head>
    <body>
        <iframe id="f" src="/"></iframe>
        <pre id="log"></pre>
        <script>
            const params = new URLSearchParams(location.search)
            const allow = params.get('readonly') !== '1'
            // The theme the editor hands the plugin: its mode, and the color
            // tokens @framer/plugin sets on the body
            const theme =
                params.get('theme') === 'dark'
                    ? {
                          mode: 'dark',
                          tokens: {
                              '--framer-color-bg': '#111111',
                              '--framer-color-bg-secondary': '#1a1a1a',
                              '--framer-color-bg-tertiary': '#2b2b2b',
                              '--framer-color-divider': '#2b2b2b',
                              '--framer-color-text': '#ffffff',
                              '--framer-color-text-secondary': '#bbbbbb',
                              '--framer-color-text-tertiary': '#888888',
                              '--framer-color-control': '#333333',
                              '--framer-color-control-hover': '#444444',
                          },
                      }
                    : null
            const permissionMap = {
                addSVG: allow,
                onDragEnd: true,
                onDragStart: true,
                onDrag: true,
                setDragData: true,
                preloadDetachedComponentLayers: true,
                preloadImageUrlForInsertion: true,
                preloadDragPreviewImage: true,
            }
            window.calls = []
            const log = (m) => {
                document.getElementById('log').textContent += m + '\n'
            }
            addEventListener('message', (e) => {
                const d = e.data,
                    src = e.source
                if (d?.type === 'pluginReadySignal') {
                    src.postMessage(
                        {
                            type: 'pluginReadyResponse',
                            mode: 'canvas',
                            permissionMap,
                            environmentInfo: null,
                            theme,
                        },
                        '*',
                    )
                    log('handshake')
                } else if (d?.type === 'methodInvocation') {
                    window.calls.push({ name: d.methodName, args: d.args })
                    const a = JSON.stringify(d.args)
                    log(
                        `${d.methodName} ${a.length > 300 ? a.slice(0, 300) + '…' : a}`,
                    )
                    src.postMessage(
                        { type: 'methodResponse', id: d.id, result: null },
                        '*',
                    )
                } else if (d?.type) {
                    log(`[${d.type}] ${JSON.stringify(d).slice(0, 200)}`)
                }
            })
        </script>
    </body>
</html>
